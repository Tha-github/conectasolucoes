<!doctype html>
<html lang="pt-BR">
  <head>
    <!-- O GitHub Pages serve esta página em qualquer URL inexistente; o <base>
         faz os caminhos relativos apontarem para a raiz do site publicado. -->
    <base href="{{build.basePath}}/">
{{> head}}
    <title>{{content.notFound.title}} | {{content.brand.name}}</title>
    <meta name="robots" content="noindex">
  </head>
  <body>
{{> header}}
    <main id="conteudo" tabindex="-1">
      <div class="section">
        <div class="container page-intro">
          <p class="eyebrow">{{content.notFound.eyebrow}}</p>
          <h1>{{content.notFound.title}}</h1>
          <p class="lead page-intro__lead">{{content.notFound.text}}</p>
          <a class="button button--primary" href="./">{{content.notFound.cta}}</a>
        </div>
      </div>
    </main>
{{> footer}}
  </body>
</html>
